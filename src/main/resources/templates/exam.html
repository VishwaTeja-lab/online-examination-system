<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Take exam</title><link rel="stylesheet" href="/style.css"></head><body><header><a href="/" class="logo">EXAM<span>FLOW</span></a><b id="timer" th:attr="data-time=${exam.duration}">00:00</b></header><main><h1 th:text="${exam.title}"></h1><form id="exam" th:action="@{/exam/{id}/submit(id=${exam.id})}" method="post"><article class="question" th:each="q:${exam.questions}"><h3 th:text="${q.prompt}"></h3><label th:each="o,st:${{q.a,q.b,q.c,q.d}}"><input type="radio" th:name="'q'+${q.id}" th:value="${'ABCD'.substring(st.index,st.index+1)}"><span th:text="${o}"></span></label></article><button>Submit answers</button></form></main><script>let t=Number(document.querySelector('#timer').dataset.time)*60;let el=document.querySelector('#timer');let f=document.querySelector('#exam');setInterval(()=>{if(t<=0){f.submit();return}t--;el.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')},1000)</script></body></html>
