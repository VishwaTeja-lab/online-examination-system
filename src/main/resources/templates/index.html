<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ExamFlow</title><link rel="stylesheet" href="/style.css"></head><body><header><a href="/" class="logo">EXAM<span>FLOW</span></a><nav><a href="/results">My results</a><a href="/admin">Admin</a></nav></header><main><section class="hero"><small>SMART • SIMPLE • ONLINE</small><h1>Your next opportunity<br><em>starts with an exam.</em></h1><p>Take assessments online and get your results instantly.</p><form action="/login" method="post" class="login" th:if="${student == null}"><input name="name" placeholder="Full name" required><input name="email" type="email" placeholder="Email address" required><button>Continue →</button></form><p th:if="${student != null}">Welcome, <b th:text="${student}"></b> <form action="/logout" method="post"><button>Log out</button></form></p></section><h2>Available examinations</h2><div class="cards"><article th:each="e:${exams}"><small>ONLINE ASSESSMENT</small><h3 th:text="${e.title}"></h3><p th:text="${e.description}"></p><p th:text="${e.duration}+' minutes · '+${#lists.size(e.questions)}+' questions'"></p><a class="button" th:href="@{/exam/{id}(id=${e.id})}">Start exam →</a></article></div></main><footer>Online Examination System · Java PBL</footer></body></html>
