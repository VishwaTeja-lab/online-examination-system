<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><link rel="stylesheet" href="/style.css"><title>Admin</title></head><body><header><a href="/" class="logo">EXAM<span>FLOW</span></a></header><main><h1>Admin dashboard</h1><article><h2>Create exam</h2><form action="/admin/create" method="post" class="stack"><input name="title" placeholder="Exam title" required><input name="description" placeholder="Description"><input name="duration" type="number" value="30"><button>Create exam</button></form></article><h2>Manage exams</h2><article th:each="e:${exams}"><h3 th:text="${e.title}"></h3><p th:text="${#lists.size(e.questions)}+' questions'"></p><form th:action="@{/admin/{id}/question(id=${e.id})}" method="post" class="stack"><input name="prompt" placeholder="Question" required><input name="a" placeholder="Option A" required><input name="b" placeholder="Option B" required><input name="c" placeholder="Option C" required><input name="d" placeholder="Option D" required><select name="answer"><option>A</option><option>B</option><option>C</option><option>D</option></select><button>Add question</button></form><form th:action="@{/admin/{id}/toggle(id=${e.id})}" method="post"><button th:text="${e.active?'Deactivate':'Activate'}"></button></form><form th:action="@{/admin/{id}/delete(id=${e.id})}" method="post"><button>Delete</button></form></article><h2>Submissions</h2><p th:each="r:${results}" th:text="${r.student}+' · '+${r.examTitle}+' · '+${r.score}+'/'+${r.total}"></p></main></body></html>
